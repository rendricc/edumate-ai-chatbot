<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduMate AI - Asisten Belajar Mandiri</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #2563eb;
      --user-bubble: #1d4ed8;
      --bot-bubble: #334155;
      --border: #475569;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .chat-container {
      width: 100%;
      max-width: 680px;
      height: 90vh;
      background: var(--card);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
    }
    .header h2 {
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 190px;
      outline: none;
    }
    .header input:focus {
      border-color: var(--accent);
    }
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .bot {
      align-self: flex-start;
      background-color: var(--bot-bubble);
      border-bottom-left-radius: 2px;
    }
    .user {
      align-self: flex-end;
      background-color: var(--user-bubble);
      border-bottom-right-radius: 2px;
    }
    .input-area {
      padding: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.4);
    }
    .input-area input {
      flex: 1;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }
    .input-area input:focus {
      border-color: var(--accent);
    }
    .input-area button {
      padding: 0 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .input-area button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <h2>🤖 EduMate AI</h2>
    <input type="password" id="apiKey" placeholder="Masukkan Gemini API Key..." />
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg bot">Halo! Aku EduMate AI. Ada konsep atau materi pelajaran yang ingin kamu diskusikan hari ini?</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ketik pertanyaan materi di sini..." onkeypress="handleKey(event)" />
    <button onclick="sendMessage()">Kirim</button>
  </div>
</div>

<script>
  async function sendMessage() {
    const apiKey = document.getElementById("apiKey").value.trim();
    const inputField = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const userText = inputField.value.trim();

    if (!userText) return;
    if (!apiKey) {
      alert("Silakan masukkan Gemini API Key terlebih dahulu di kolom kanan atas!");
      return;
    }

    appendMessage(userText, "user");
    inputField.value = "";

    const botMsgDiv = appendMessage("EduMate sedang berpikir...", "bot");

    try {
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
      
      const payload = {
        contents: [{
          parts: [{
            text: `Kamu adalah EduMate AI, asisten tutor belajar ramah dan edukatif. Jelaskan jawaban materi dengan runtut, analogi sederhana, dan mudah dimengerti. Pertanyaan pengguna: ${userText}`
          }]
        }]
      };

      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (data.candidates && data.candidates[0].content.parts[0].text) {
        botMsgDiv.innerText = data.candidates[0].content.parts[0].text;
      } else {
        botMsgDiv.innerText = "Respon tidak dapat dimuat. Pastikan API Key valid dan kuota akun aktif.";
      }
    } catch (err) {
      botMsgDiv.innerText = "Terjadi gangguan saat menghubungi Gemini API. Periksa sambungan internet.";
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function appendMessage(text, sender) {
    const chatBox = document.getElementById("chatBox");
    const msg = document.createElement("div");
    msg.className = `msg ${sender}`;
    msg.innerText = text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    return msg;
  }

  function handleKey(e) {
    if (e.key === "Enter") sendMessage();
  }
</script>

</body>
</html>
